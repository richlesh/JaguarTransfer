name: Build and Release macOS

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. 1.0.0)"
        required: true

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=build-keychain-password
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Inject license salt
        run: |
          echo "const LICENSE_SALT = \"${{ secrets.LICENSE_SALT }}\";" > license.cjs
          echo "module.exports = { LICENSE_SALT };" >> license.cjs

      - name: Build renderer + main
        run: npm run build

      - name: Build macOS ${{ matrix.arch }} DMG (signed + notarized)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: MMZ3Y97NTP
          CSC_KEYCHAIN: ${{ runner.temp }}/build.keychain
          CSC_KEY_PASSWORD: build-keychain-password
        run: |
          KEY_FILE=$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          printf '%s\n' "${{ secrets.APPLE_API_KEY }}" > "$KEY_FILE"
          # Fail fast with a clear message if the App Store Connect API key secret
          # is missing or not a valid PEM (notarytool otherwise dies with the
          # opaque 'invalidPEMDocument'). The .p8 must include the BEGIN/END lines.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
            echo "::error::APPLE_API_KEY secret is empty or not a valid .p8 PEM."
            echo "It must be the full contents of your App Store Connect AuthKey_*.p8," \
                 "including the -----BEGIN PRIVATE KEY----- / -----END PRIVATE KEY----- lines" \
                 "and its newlines. Also confirm APPLE_API_KEY_ID and APPLE_API_ISSUER are set."
            exit 1
          fi
          APPLE_API_KEY="$KEY_FILE" ./node_modules/.bin/electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: TransferJaguar ${{ inputs.tag || github.ref_name }}
          draft: true
          files: dist/*.dmg
