name: Build and Release macOS

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. 1.0.0)"
        required: true

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=build-keychain-password
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Inject license salt
        run: |
          echo "const LICENSE_SALT = \"${{ secrets.LICENSE_SALT }}\";" > license.cjs
          echo "module.exports = { LICENSE_SALT };" >> license.cjs

      - name: Build renderer + main
        run: npm run build

      - name: Build macOS ${{ matrix.arch }} DMG (signed + notarized)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: MMZ3Y97NTP
          CSC_KEYCHAIN: ${{ runner.temp }}/build.keychain
          CSC_KEY_PASSWORD: build-keychain-password
        run: |
          KEY_FILE=$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          # Prefer a base64-encoded key secret (APPLE_API_KEY_BASE64) to avoid the
          # newline mangling that produces notarytool's 'invalidPEMDocument'. Fall
          # back to the raw-PEM secret (APPLE_API_KEY) for compatibility.
          if [ -n "${{ secrets.APPLE_API_KEY_BASE64 }}" ]; then
            echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "$KEY_FILE"
          else
            printf '%s\n' "${{ secrets.APPLE_API_KEY }}" > "$KEY_FILE"
          fi
          # Validate the decoded .p8 is a well-formed PEM before notarizing, so a
          # bad secret fails fast with a clear message instead of deep in notarytool.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE" || ! grep -q "END PRIVATE KEY" "$KEY_FILE"; then
            echo "::error::App Store Connect API key is not a valid .p8 PEM."
            echo "Set APPLE_API_KEY_BASE64 to 'base64 -i AuthKey_XXXX.p8' (recommended, no newline"
            echo "issues), or APPLE_API_KEY to the full raw .p8 contents including the BEGIN/END"
            echo "lines and line breaks. Also confirm APPLE_API_KEY_ID and APPLE_API_ISSUER."
            exit 1
          fi
          # A valid .p8 base64 body should span multiple lines; warn if it's one
          # long line (a common paste error that yields invalidPEMDocument).
          BODY_LINES=$(sed '1d;$d' "$KEY_FILE" | grep -c .)
          echo "API key PEM body lines: $BODY_LINES"
          APPLE_API_KEY="$KEY_FILE" ./node_modules/.bin/electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: TransferJaguar ${{ inputs.tag || github.ref_name }}
          draft: true
          files: dist/*.dmg
