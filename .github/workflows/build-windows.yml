name: Build and Release Windows

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. 1.0.0)"
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Clear electron-builder NSIS cache
        # Works around intermittent "Plugin not found" errors from a corrupted
        # NSIS toolchain in the electron-builder cache; forces a clean re-download.
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA "electron-builder\Cache\nsis"
          if (Test-Path $cache) { Remove-Item -Recurse -Force $cache }

      # NOTE: M1 ships unsigned. To enable Authenticode signing, add the signing
      # step (see BudgetLion's workflow, e.g. Azure Artifact Signing).
      - name: Build Windows ${{ matrix.arch }} installer
        run: ./node_modules/.bin/electron-builder --win --${{ matrix.arch }} --publish never

      - name: Upload installer to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: JaguarTransfer ${{ inputs.tag || github.ref_name }}
          draft: true
          files: dist/*.exe
